<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IACS Attendance Portal</title>
  <link rel="icon" href="https://iacswa.org/favicon.ico">
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    iframe { flex: 1; border: 0; width: 100%; }
    .fallback { padding: 8px 16px; text-align: center; font-size: 13px; color: #555; }
    .fallback a { color: inherit; }
  </style>
</head>
<body>
  <!-- Paste the Apps Script web app URL (Deploy → Manage deployments) into both places below. -->
  <iframe src="https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec" title="IACS Attendance Portal"></iframe>
  <p class="fallback">
    Trouble loading? <a href="https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec" target="_blank" rel="noopener">Open the portal in a new tab</a>.
  </p>
</body>
</html>
